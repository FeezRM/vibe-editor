<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* LOCKUP-FIRST plumbing example only. ig-hook owns mode selection and the full 0-8s.
     This file demonstrates a HyperFrames lockup; it is not the default opening. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  #root { width:1080px; height:1920px; background:var(--ground); }

  /* HERO FRAME first - static CSS. Animation comes after. */
  .scene-content { justify-content:center; gap:40px; }
  .kicker { }
  .line   { font-size:170px; max-width:12ch; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="hook-slam"
       data-start="0" data-duration="2.0"
       data-width="1080" data-height="1920"
       data-fps="30" data-track-index="0"
       data-composition-variables='{"kicker":{"type":"string","default":"THE THESIS"},"before":{"type":"string","default":"posting is"},"hot":{"type":"string","default":"gambling."}}'>
    <div class="scene-content">
      <p class="label kicker" id="kicker">THE THESIS</p>
      <h1 class="display line" id="line"><span id="before">posting is</span> <span class="hot" id="hot">gambling.</span></h1>
    </div>
  </div>

<script>
  (function () {
    var v = (window.__hyperframes && window.__hyperframes.getVariables)
      ? window.__hyperframes.getVariables() : {};
    if (v.kicker) document.getElementById('kicker').textContent = v.kicker;
    if (v.before) document.getElementById('before').textContent = v.before;
    if (v.hot)    document.getElementById('hot').textContent    = v.hot;

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // SLAM - the whole block lands in one move. 0.18s expo.out.
    tl.from("#root .scene-content", { scale: 1.06, opacity: 0, duration: 0.18, ease: "expo.out" }, 0.10);
    tl.from("#kicker", { y: 18, opacity: 0, duration: 0.28, ease: "power4.out" }, 0.14);
    // the accent word lands 0.10s after the line so the eye catches it separately
    tl.from("#hot", { opacity: 0, duration: 0.16, ease: "expo.out" }, 0.30);
    // ambient: 1.5% breath on the accent word so it is not dead against moving A-roll
    tl.to("#hot", { scale: 1.015, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1,
                    transformOrigin: "left center" }, 0.50);
    // NO EXIT. the cut is the exit.

    window.__timelines["hook-slam"] = tl;
  })();
</script>
</body>
</html>
