<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* BLOCK 03 - THE COUNTER.  Overlay, DOCK-BL. Render --format mov (alpha).
     Real numbers with real units. "4,000,000" not "4M+".
     Spec: BLOCKS.md #03 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { width:1080px; height:1920px; background:transparent; }

  .dock { position:absolute; left:var(--dock-bl-x); top:var(--dock-bl-y); width:860px; }
  .count { font-family:var(--font-mono); font-weight:700; font-size:130px;
           font-variant-numeric:tabular-nums; color:var(--ink); line-height:1; }
  .under { height:2px; background:var(--accent); width:100%; transform-origin:left center;
           transform:scaleX(0); margin:22px 0 16px; }
  .unit  { font-size:28px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="counter"
       data-start="0" data-duration="2.4"
       data-width="1080" data-height="1920"
       data-fps="30" data-track-index="0"
       data-composition-variables='{"value":{"type":"number","default":4000000},"unit":{"type":"string","default":"VIEWS IN 24 HOURS"},"prefix":{"type":"string","default":""},"from":{"type":"number","default":0}}'>
    <div class="dock">
      <p class="count" id="cval">0</p>
      <div class="under" id="cunder"></div>
      <p class="label unit" id="cunit">VIEWS IN 24 HOURS</p>
    </div>
  </div>

<script>
  (function () {
    var v = (window.__hyperframes && window.__hyperframes.getVariables)
      ? window.__hyperframes.getVariables() : {};
    var VALUE  = v.value  != null ? Number(v.value) : 4000000;
    var FROM   = v.from   != null ? Number(v.from)  : 0;
    var UNIT   = v.unit   != null ? v.unit   : "VIEWS IN 24 HOURS";
    var PREFIX = v.prefix != null ? v.prefix : "";
    document.getElementById("cunit").textContent = UNIT;

    var el = document.getElementById("cval");
    var c  = { n: FROM };
    var paint = function () { el.textContent = PREFIX + Math.round(c.n).toLocaleString("en-US"); };
    paint();

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    tl.from(".count", { y: 26, opacity: 0, duration: 0.30, ease: "power4.out" }, 0.12);
    // COUNT - decelerates into the number instead of stopping dead
    tl.to(c, { n: VALUE, duration: 0.90, ease: "power2.out", onUpdate: paint }, 0.20);
    // the accent underline WIPEs in only after the count settles
    tl.to("#cunder", { scaleX: 1, duration: 0.34, ease: "power4.out" }, 1.12);
    tl.from(".unit", { opacity: 0, y: 12, duration: 0.26, ease: "power2.out" }, 1.24);
    // NO EXIT.

    window.__timelines["counter"] = tl;
  })();
</script>
</body>
</html>
