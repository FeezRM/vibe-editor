<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* BLOCK 02 - THE DIAL.  Overlay, DOCK-C. Render --format mov (alpha).
     The signature analog block: a brass instrument reading a real value.
     Spec: BLOCKS.md #02 · Texture: TEXTURE.md · Motion: MOTION-LANGUAGE.md §5

     HERO FRAME IS LAID OUT HERE IN CSS. GSAP only animates INTO this state. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { width:1080px; height:1920px; background:transparent; position:relative; }

  .dial      { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .dial__svg { position:absolute; left:0; top:0; }

  /* readout sits under the instrument, on the shared left axis of the dock */
  .dial__foot {
    position:absolute; left:0; top:1090px; width:1080px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .dial__value { font-family:var(--font-mono); font-weight:700; font-size:76px;
                 font-variant-numeric:tabular-nums; color:var(--ink); }
  .dial__label { font-family:var(--font-engrave); font-size:24px; font-weight:600;
                 letter-spacing:var(--track-engrave); text-transform:uppercase;
                 color:var(--ink-dim); }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="dial"
       data-start="0" data-duration="3.0"
       data-width="1080" data-height="1920"
       data-fps="30" data-track-index="0"
       data-composition-variables='{"label":{"type":"string","default":"REVENUE PER REEL"},"value":{"type":"number","default":2997},"max":{"type":"number","default":5000},"prefix":{"type":"string","default":"$"},"segments":{"type":"number","default":8}}'>

    <div class="dial">
      <svg class="dial__svg" width="1080" height="1920" viewBox="0 0 1080 1920"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <!-- metal ramp: 5 stops, specular off-centre at 45%. never a flat hue. -->
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"    stop-color="#8A6A2A"/>
            <stop offset="0.25" stop-color="#C9A24B"/>
            <stop offset="0.45" stop-color="#F0D98C"/>
            <stop offset="0.65" stop-color="#C9A24B"/>
            <stop offset="1"    stop-color="#8A6A2A"/>
          </linearGradient>
        </defs>

        <g id="inst" transform="translate(540,760)">
          <circle id="bezelOuter" class="bezel"      r="300" fill="none"/>
          <circle id="bezelInner" class="bezel--gold" r="272" fill="none"
                  stroke="url(#brass)" stroke-width="2"/>
          <g id="ticks"></g>
          <g id="numerals"></g>
          <g id="needleGrp">
            <line id="needle" class="needle" x1="0" y1="14" x2="0" y2="-186"/>
            <circle class="needle__cap" r="13" fill="url(#brass)"/>
            <circle r="5" fill="var(--ground)"/>
          </g>
        </g>
      </svg>

      <div class="dial__foot">
        <p class="dial__value" id="dvalue">$0</p>
        <p class="dial__label" id="dlabel">REVENUE PER REEL</p>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ---- variables ------------------------------------------------------- */
  var v = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : {};
  var LABEL  = v.label    != null ? v.label            : "REVENUE PER REEL";
  var VALUE  = v.value    != null ? Number(v.value)    : 2997;
  var MAX    = v.max      != null ? Number(v.max)      : 5000;
  var PREFIX = v.prefix   != null ? v.prefix           : "$";
  var SEG    = v.segments != null ? Number(v.segments) : 8;

  var PCT = Math.max(0, Math.min(1, MAX ? VALUE / MAX : 0));

  /* Needle sweeps a 270-degree arc, -135 (min) to +135 (max).
     A full 360 dial has no readable zero, so the bottom quadrant is dead space. */
  var ANGLE_MIN = -135, ANGLE_SPAN = 270;
  var TARGET    = ANGLE_MIN + ANGLE_SPAN * PCT;

  var SVGNS = "http://www.w3.org/2000/svg";
  var ticks = document.getElementById("ticks");
  var nums  = document.getElementById("numerals");

  function el(name, attrs) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* ---- tick ring -------------------------------------------------------
     Consistent unit logic is what makes this read as a real instrument
     scale rather than decorative dashes: minor every 5deg at 1px/ghost,
     major every 45deg at 2px/full-ink and longer. */
  var R_TICK = 258;
  for (var a = ANGLE_MIN; a <= ANGLE_MIN + ANGLE_SPAN + 0.001; a += 5) {
    var major = Math.abs((a - ANGLE_MIN) % 45) < 0.001;
    var len   = major ? 22 : 11;
    var rad   = (a - 90) * Math.PI / 180;
    var x1 = Math.cos(rad) * R_TICK,         y1 = Math.sin(rad) * R_TICK;
    var x2 = Math.cos(rad) * (R_TICK - len), y2 = Math.sin(rad) * (R_TICK - len);
    ticks.appendChild(el("line", {
      x1: x1.toFixed(2), y1: y1.toFixed(2), x2: x2.toFixed(2), y2: y2.toFixed(2),
      "class": major ? "tick tick--major" : "tick",
      "stroke-linecap": "round"
    }));
  }

  /* ---- radial numerals -------------------------------------------------
     Each numeral is its own <text>, rotated into place then counter-rotated
     to stay upright. textPath kerns unevenly at low counts. */
  var R_NUM = 200;
  for (var i = 0; i < SEG; i++) {
    var ang = ANGLE_MIN + (ANGLE_SPAN / (SEG - 1)) * i;
    var t = el("text", {
      "class": "numeral",
      "text-anchor": "middle",
      "dominant-baseline": "central",
      transform: "rotate(" + ang.toFixed(3) + ") translate(0," + (-R_NUM) +
                 ") rotate(" + (-ang).toFixed(3) + ")"
    });
    t.textContent = String(i + 1);
    nums.appendChild(t);
  }

  /* ---- static text ------------------------------------------------------ */
  var valueEl = document.getElementById("dvalue");
  document.getElementById("dlabel").textContent = LABEL;

  function fmt(n) { return PREFIX + Math.round(n).toLocaleString("en-US"); }
  valueEl.textContent = fmt(VALUE);          /* hero state; animated FROM below */

  /* ---- draw-on setup for the bezel -------------------------------------- */
  var bo = document.getElementById("bezelOuter");
  var bi = document.getElementById("bezelInner");
  [bo, bi].forEach(function (c) {
    var len = 2 * Math.PI * Number(c.getAttribute("r"));
    c.style.strokeDasharray  = len;
    c.style.strokeDashoffset = 0;
    c.dataset.len = len;
  });

  /* ---- timeline --------------------------------------------------------- */
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  /* 0.12  bezels DRAW on, inner staggered behind outer */
  tl.from(bo, { strokeDashoffset: Number(bo.dataset.len), duration: 0.55,
                ease: "power2.inOut" }, 0.12);
  tl.from(bi, { strokeDashoffset: Number(bi.dataset.len), duration: 0.55,
                ease: "power2.inOut" }, 0.20);

  /* 0.26  ticks WIPE in from the centre outward, 40ms stagger */
  tl.from(ticks.children, { opacity: 0, scale: 0.92, transformOrigin: "center center",
                            duration: 0.26, ease: "power3.out",
                            stagger: { each: 0.008, from: "center" } }, 0.26);

  /* 0.46  numerals STAMP in, 80ms stagger */
  tl.from(nums.children, { opacity: 0, scale: 0.88, transformOrigin: "center center",
                           duration: 0.20, ease: "expo.out", stagger: 0.08 }, 0.46);

  /* 0.90  SWEEP - throw past the target, then settle back. this overshoot is
           the difference between a graphic and an instrument. stepped to
           ~15fps so the motion judders very slightly (TEXTURE.md §5).

     NOTE svgOrigin, not transformOrigin. transformOrigin on an SVG group
     resolves against the group's own bounding box, which for a needle sits
     ~86px from the hub — the needle would visibly point at the wrong value.
     svgOrigin takes user-space coords; #needleGrp already lives inside
     translate(540,760), so the hub is 0 0 in its space. */
  tl.fromTo("#needleGrp",
    { rotation: ANGLE_MIN, svgOrigin: "0 0" },
    { rotation: TARGET + 3, svgOrigin: "0 0", duration: 0.60, ease: "steps(9)" }, 0.90);
  tl.to("#needleGrp", { rotation: TARGET, svgOrigin: "0 0", duration: 0.35,
                        ease: "power1.inOut" }, 1.50);

  /* 0.90  value COUNTs in sync with the sweep */
  var counter = { n: 0 };
  tl.to(counter, { n: VALUE, duration: 0.90, ease: "power2.out",
                   onUpdate: function () { valueEl.textContent = fmt(counter.n); } }, 0.90);

  /* 1.10  foot text rises in behind the count */
  tl.from(".dial__label", { y: 14, opacity: 0, duration: 0.28, ease: "power3.out" }, 1.10);

  /* 1.95  ambient - the whole instrument breathes so it is not dead against
           moving A-roll. finite repeats only: ceil(1.05 / 0.70) - 1 = 1 */
  tl.to("#inst", { scale: 1.006, svgOrigin: "540 760", duration: 0.70,
                   ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.95);

  /* NO EXIT. The cut is the exit. */

  window.__timelines["dial"] = tl;
})();
</script>
</body>
</html>
