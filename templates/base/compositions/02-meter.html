<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* BLOCK 02 - THE METER.  Overlay, DOCK-BL. Render --format mov (alpha).
     The signature block: the literal picture of "I measure, you guess."
     Spec: BLOCKS.md #02 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { width:1080px; height:1920px; background:transparent; }

  .dock { position:absolute; left:var(--dock-bl-x); top:var(--dock-bl-y); width:800px; }
  .meter__head { display:flex; align-items:baseline; justify-content:space-between; width:760px; margin-bottom:20px; }
  .meter__value { font-family:var(--font-mono); font-weight:700; font-size:64px;
                  font-variant-numeric:tabular-nums; color:var(--ink); }
  .meter__bounds { display:flex; justify-content:space-between; width:760px; margin-top:16px; }
  .meter__bounds .label { font-size:22px; }
  .tick { position:absolute; top:-8px; width:2px; height:30px; background:var(--accent); opacity:0; }
  .meter__wrap { position:relative; width:760px; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="meter"
       data-start="0" data-duration="2.6"
       data-width="1080" data-height="1920"
       data-fps="30" data-track-index="0"
       data-composition-variables='{"label":{"type":"string","default":"REVENUE PER REEL"},"value":{"type":"number","default":2997},"max":{"type":"number","default":5000},"prefix":{"type":"string","default":"$"},"suffix":{"type":"string","default":""}}'>
    <div class="dock">
      <div class="meter__head">
        <p class="label" id="mlabel">REVENUE PER REEL</p>
        <p class="meter__value" id="mvalue">$0</p>
      </div>
      <div class="meter__wrap">
        <div class="meter__track"><div class="meter__fill" id="mfill"></div></div>
        <div class="tick" id="mtick"></div>
      </div>
      <div class="meter__bounds">
        <p class="label" id="mmin">0</p>
        <p class="label" id="mmax">5000</p>
      </div>
    </div>
  </div>

<script>
  (function () {
    var v = (window.__hyperframes && window.__hyperframes.getVariables)
      ? window.__hyperframes.getVariables() : {};
    var LABEL  = v.label  != null ? v.label  : "REVENUE PER REEL";
    var VALUE  = v.value  != null ? Number(v.value) : 2997;
    var MAX    = v.max    != null ? Number(v.max)   : 5000;
    var PREFIX = v.prefix != null ? v.prefix : "$";
    var SUFFIX = v.suffix != null ? v.suffix : "";
    var PCT    = Math.max(0, Math.min(1, VALUE / MAX));

    var fmt = function (n) { return Math.round(n).toLocaleString("en-US"); };
    document.getElementById("mlabel").textContent = LABEL;
    document.getElementById("mmin").textContent   = PREFIX + "0" + SUFFIX;
    document.getElementById("mmax").textContent   = PREFIX + fmt(MAX) + SUFFIX;
    document.getElementById("mtick").style.left   = (760 * PCT) + "px";

    var valueEl = document.getElementById("mvalue");
    var counter = { n: 0 };

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // 0.12  label + head WIPE in
    tl.from(".meter__head", { y: 22, opacity: 0, duration: 0.28, ease: "power4.out" }, 0.12);
    // 0.20  track WIPEs in (stagger 80ms behind the head)
    tl.from(".meter__track", { scaleX: 0, opacity: 0, duration: 0.30, ease: "power3.out",
                               transformOrigin: "left center" }, 0.20);
    tl.from(".meter__bounds", { opacity: 0, duration: 0.26, ease: "power2.out" }, 0.26);
    // 0.34  FILL + COUNT together - the bar and the number are the same fact
    tl.to("#mfill", { scaleX: PCT, duration: 0.70, ease: "power2.out" }, 0.34);
    tl.to(counter, { n: VALUE, duration: 0.90, ease: "power2.out",
                     onUpdate: function () { valueEl.textContent = PREFIX + fmt(counter.n) + SUFFIX; } }, 0.34);
    // 1.10  the tick SNAPs at the landing position
    tl.to("#mtick", { opacity: 1, duration: 0.12, ease: "expo.out" }, 1.10);
    // ambient - the fill breathes so it is not dead against moving A-roll.
    // finite repeats only: Math.ceil(1.4 / 0.7) - 1 = 1
    tl.to("#mfill", { opacity: 0.985, duration: 0.70, ease: "sine.inOut",
                      yoyo: true, repeat: 1 }, 1.20);
    // NO EXIT.

    window.__timelines["meter"] = tl;
  })();
</script>
</body>
</html>
