<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* BLOCK 08 - THE CHIP.  Overlay, DOCK-TL. Render --format mov (alpha).
     Proof as a quiet corner tag. Small, quiet, devastating.
     Spec: BLOCKS.md #08 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { width:1080px; height:1920px; background:transparent; }
  .dock { position:absolute; left:var(--dock-tl-x); top:var(--dock-tl-y); }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="chip"
       data-start="0" data-duration="2.0"
       data-width="1080" data-height="1920"
       data-fps="30" data-track-index="0"
       data-composition-variables='{"text":{"type":"string","default":"4,912,004 VIEWS"},"dot":{"type":"boolean","default":true}}'>
    <div class="dock">
      <div class="chip" id="chip">
        <span class="chip__dot" id="dot"></span>
        <span id="ctext">4,912,004 VIEWS</span>
      </div>
    </div>
  </div>

<script>
  (function () {
    var v = (window.__hyperframes && window.__hyperframes.getVariables)
      ? window.__hyperframes.getVariables() : {};
    if (v.text != null) document.getElementById("ctext").textContent = v.text;
    if (v.dot === false) document.getElementById("dot").style.display = "none";

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // SNAP in, tiny settle
    tl.from("#chip", { scale: 0.94, opacity: 0, duration: 0.16, ease: "expo.out",
                       transformOrigin: "left center" }, 0.10);
    tl.from("#chip", { y: 4, duration: 0.22, ease: "power2.out" }, 0.10);
    // ambient - the dot breathes like a status LED.
    // finite repeats: Math.ceil(1.6 / 0.8) - 1 = 1
    tl.to("#dot", { opacity: 0.45, duration: 0.80, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.34);
    // NO EXIT.

    window.__timelines["chip"] = tl;
  })();
</script>
</body>
</html>
